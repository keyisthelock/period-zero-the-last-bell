<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Period Zero: The Last Bell</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="vignette"></div>
    <canvas id="grain"></canvas>
    <div id="fade"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="objective"></div>
      <div id="chapter-card" class="hidden"><div class="num"></div><div class="name"></div></div>
      <div id="subtitles"></div>
      <div id="toast" class="hidden"></div>
      <div id="inv-bar"></div>
      <div id="hud-hint">TAB inventory · F flashlight · M mute · ESC pause</div>
    </div>

    <!-- Modal layer for documents / puzzles / inventory -->
    <div id="modal" class="hidden"><div id="modal-inner"></div></div>

    <!-- Main menu -->
    <div id="menu" class="screen">
      <div class="menu-box">
        <div class="title-small">PERIOD ZERO</div>
        <h1>THE LAST BELL</h1>
        <div class="menu-buttons">
          <button id="btn-new">New Game</button>
          <button id="btn-continue">Continue</button>
          <button id="btn-chapters">Chapters</button>
          <button id="btn-controls">Controls</button>
        </div>
        <div id="chapter-list" class="hidden"></div>
        <div id="controls-panel" class="hidden">
          <table>
            <tr><td>W A S D</td><td>Move</td></tr>
            <tr><td>Mouse</td><td>Look</td></tr>
            <tr><td>Shift</td><td>Sprint</td></tr>
            <tr><td>E</td><td>Interact / examine</td></tr>
            <tr><td>F</td><td>Flashlight</td></tr>
            <tr><td>Tab / I</td><td>Inventory &amp; notes</td></tr>
            <tr><td>M</td><td>Mute audio</td></tr>
            <tr><td>Esc</td><td>Pause</td></tr>
          </table>
        </div>
        <div class="menu-foot">Headphones recommended. Contains flashing lights and loud sounds.</div>
      </div>
    </div>

    <!-- Pause -->
    <div id="pause" class="screen hidden">
      <div class="menu-box">
        <h2>PAUSED</h2>
        <div class="menu-buttons">
          <button id="btn-resume">Resume</button>
          <button id="btn-reload">Reload Checkpoint</button>
          <button id="btn-mute">Mute: Off</button>
          <button id="btn-subs">Subtitles: On</button>
          <button id="btn-quality">Graphics: auto</button>
          <button id="btn-quit">Main Menu</button>
        </div>
        <div class="sens-row">Mouse sensitivity <input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="1" /></div>
      </div>
    </div>

    <!-- Ending -->
    <div id="ending" class="screen hidden">
      <div class="ending-box"><div id="ending-text"></div><button id="btn-end-menu">Return to Menu</button></div>
    </div>

    <div id="debug" class="hidden"></div>
    <div id="loading" class="hidden">...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
